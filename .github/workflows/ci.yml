name: Servizato CI

on:
  pull_request:
    branches:
      - main
      - servizato-staging

  push:
    branches:
      - main
      - servizato-staging

permissions:
  contents: read

concurrency:
  group: servizato-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy-staging:
    name: Deploy staging to KVM2
    needs: ci

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/servizato-staging'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: servizato-kvm2-deployment
      cancel-in-progress: false

    environment:
      name: production
      url: https://servizato.in

    steps:
      - name: Test verified SSH connection
        shell: bash
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_HOST_PUBLIC_KEY: ${{ secrets.VPS_HOST_PUBLIC_KEY }}
    run: |
      set -euo pipefail

      test -n "$VPS_HOST"
      test -n "$VPS_USER"
      test -n "$VPS_SSH_KEY"
      test -n "$VPS_HOST_PUBLIC_KEY"

      mkdir -p "$RUNNER_TEMP/servizato-ssh"
      chmod 700 "$RUNNER_TEMP/servizato-ssh"

      printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/servizato-ssh/id_ed25519"
      chmod 600 "$RUNNER_TEMP/servizato-ssh/id_ed25519"

      ssh-keygen -y -f "$RUNNER_TEMP/servizato-ssh/id_ed25519" > /dev/null

      printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_PUBLIC_KEY" > "$RUNNER_TEMP/servizato-ssh/known_hosts"

      ssh -i "$RUNNER_TEMP/servizato-ssh/id_ed25519" \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$RUNNER_TEMP/servizato-ssh/known_hosts" \
        -o HostKeyAlgorithms=ssh-ed25519 \
        -o BatchMode=yes \
        -o ConnectTimeout=15 \
        "$VPS_USER@$VPS_HOST" \
        'whoami && hostname'
