
name: Servizato CI

on:
  pull_request:
    branches:
      - main
      - servizato-staging

  push:
    branches:
      - main
      - servizato-staging

permissions:
  contents: read

concurrency:
  group: servizato-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy-staging:
    name: Deploy staging to KVM2
    needs: ci

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/servizato-staging'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: servizato-kvm2-deployment
      cancel-in-progress: false

    environment:
      name: production
      url: https://servizato.in

    steps:
      - name: Deploy Servizato staging via SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_PUBLIC_KEY: ${{ secrets.VPS_HOST_PUBLIC_KEY }}
          DEPLOY_SHA: ${{ github.sha }}

        run: |
          set -euo pipefail

          SSH_DIR="$RUNNER_TEMP/servizato-ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_DIR/id_ed25519"
          chmod 600 "$SSH_DIR/id_ed25519"

          ssh-keygen -y -f "$SSH_DIR/id_ed25519" > /dev/null

          printf '%s %s\n' "$VPS_HOST" "$VPS_HOST_PUBLIC_KEY" \
            > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/known_hosts"

          echo "Connecting to KVM2..."

          ssh -i "$SSH_DIR/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -se -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail

          DEPLOY_SHA="$1"
          cd /opt/servizato

          echo "Fetching staging branch..."
          git fetch origin \
            +refs/heads/servizato-staging:refs/remotes/origin/servizato-staging

          echo "Verifying deployment commit..."
          git merge-base --is-ancestor \
            "$DEPLOY_SHA" origin/servizato-staging

          echo "Checking out staging commit..."
          git checkout -B servizato-staging "$DEPLOY_SHA"

          echo "Validating Docker configuration..."
          docker compose --env-file .env.production config --quiet

          echo "Building Servizato..."
          docker compose --env-file .env.production build

          echo "Starting Servizato..."
          docker compose --env-file .env.production up -d

          echo "Checking application health..."
          healthy=0

          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:3000/api/health > /dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Application health check failed."
            docker compose ps
            exit 1
          fi

          echo "Docker container status:"
          docker compose ps

          echo "Deployed Git commit:"
          git log -1 --oneline

          echo "Staging deployment successful!"
          REMOTE
