
name: Servizato CI

on:
  pull_request:
    branches:
      - main
      - servizato-staging

  push:
    branches:
      - main
      - servizato-staging

permissions:
  contents: read

concurrency:
  group: servizato-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy-staging:
    name: Deploy staging to KVM2
    needs: ci

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/servizato-staging'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: servizato-kvm2-deployment
      cancel-in-progress: false

    environment:
      name: production
      url: https://servizato.in

    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 35m
          script: |
            set -eu

            cd /opt/servizato

            echo "Fetching staging branch..."
            git fetch origin +refs/heads/servizato-staging:refs/remotes/origin/servizato-staging

            git checkout -B servizato-staging origin/servizato-staging

            echo "Validating Docker configuration..."
            docker compose --env-file .env.production config --quiet

            echo "Building application..."
            docker compose --env-file .env.production build

            echo "Starting application..."
            docker compose --env-file .env.production up -d

            echo "Checking health..."
            healthy=0
            for attempt in $(seq 1 24); do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:3000/api/health > /dev/null; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Application health check failed."
              docker compose ps
              exit 1
            fi

            docker compose ps
            git rev-parse --short HEAD

            echo "Staging deployed successfully."
