
name: Deploy Servizato Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Promote main to production

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: servizato-kvm2-deployment
      cancel-in-progress: false

    environment:
      name: production
      url: https://servizato.in

    steps:
      - name: Deploy main over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 35m
          script: |
            set -eu

            cd /opt/servizato

            echo "Fetching main branch..."
            git fetch origin +refs/heads/main:refs/remotes/origin/main

            git checkout -B main origin/main

            docker compose --env-file .env.production config --quiet

            echo "Building production..."
            docker compose --env-file .env.production build

            echo "Starting production..."
            docker compose --env-file .env.production up -d

            echo "Checking health..."
            healthy=0
            for attempt in $(seq 1 24); do
              if curl -fsS --max-time 5 \
                http://127.0.0.1:3000/api/health > /dev/null; then
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Production health check failed."
              docker compose ps
              exit 1
            fi

            docker compose ps
            git rev-parse --short HEAD

            echo "Production deployment successful."
